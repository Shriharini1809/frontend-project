<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/Rectangle 1 (1).png"
    />
    <link rel="stylesheet" href="style.css">
    <title>Product preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <img src="./images/image-product-desktop.jpg" alt="" class="perfume"/>
      </div>
      <div class="right-side">
        <p class="perfume-1">Perfume</p>
        <h2 class="perfume-2">Gabrielle Essence Eau De Parfum</h2>
        <p class="perfume-3">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <h1 class="price-1">$149.99</h1>
          <p class="price-2">$169.99</p>
          
        </div>
        <button class="btn">
          <div class="cart"><img src="./images/icon-cart.svg" alt=""></div>
          <p class="cart-text">Add to Cart</p>
        </button>
      </div>
    </div>
  </body>
</html>
